eX(1)}100%{transform:scaleX(0)}}.a16{animation:a16 16.0s linear infinite}.a16{transform-box:fill-box;transform-origin:left center}@keyframes a17{0%,17.5%{opacity:0}19.7%,96%{opacity:1}100%{opacity:0}}.a17{animation:a17 16.0s linear infinite}@keyframes a18{0%,20.3%{transform:scaleX(0)}26.6%,96%{transform:scaleX(1)}100%{transform:scaleX(0)}}.a18{animation:a18 16.0s linear infinite}.a18{transform-box:fill-box;transform-origin:left center}@keyframes a19{0%,20.3%{opacity:0}22.5%,96%{opacity:1}100%{opacity:0}}.a19{animation:a19 16.0s linear infinite}@keyframes a20{0%,23.1%{transform:scaleX(0)}29.4%,96%{transform:scaleX(1)}100%{transform:scaleX(0)}}.a20{animation:a20 16.0s linear infinite}.a20{transform-box:fill-box;transform-origin:left center}@keyframes a21{0%,23.1%{opacity:0}25.3%,96%{opacity:1}100%{opacity:0}}.a21{animation:a21 16.0s linear infinite}@keyframes a22{0%,25.9%{transform:scaleX(0)}32.2%,96%{transform:scaleX(1)}100%{transform:scaleX(0)}}.a22{animation:a22 16.0s linear infinite}.a22{transform-box:fill-box;transform-origin:left center}@keyframes a23{0%,25.9%{opacity:0}28.1%,96%{opacity:1}100%{opacity:0}}.a23{animation:a23 16.0s linear infinite}@keyframes a24{0%,32.5%{opacity:0}34.7%,96%{opacity:1}100%{opacity:0}}.a24{animation:a24 16.0s linear infinite}@keyframes a25{0%,1.2%{transform:scaleX(0)}7.5%,96%{transform:scaleX(1)}100%{transform:scaleX(0)}}.a25{animation:a25 16.0s linear infinite}.quick{transform-box:fill-box;transform-origin:left center}@media (prefers-reduced-motion:reduce){g,rect{animation:none !important;opacity:1;transform:none}}</style><rect x="10" y="10" width="450" height="420" rx="12" class="panel"/><text x="30" y="46" class="title" text-anchor="start">One variant, the usual way</text><text x="30" y="72" class="note" text-anchor="start">BRAF V600E, or was it c.1799T>A? hg19 or hg38?</text><g class="a1"><rect x="30" y="92" width="195" height="34" rx="6" class="tab"/><text x="44" y="114" class="label" text-anchor="start">ClinVar</text><text x="211" y="114" class="small" text-anchor="end">search, read, copy</text></g><g class="a2"><rect x="235" y="92" width="195" height="34" rx="6" class="tab"/><text x="249" y="114" class="label" text-anchor="start">gnomAD</text><text x="416" y="114" class="small" text-anchor="end">search, read, copy</text></g><g class="a3"><rect x="30" y="134" width="195" height="34" rx="6" class="tab"/><text x="44" y="156" class="label" text-anchor="start">Ensembl</text><text x="211" y="156" class="small" text-anchor="end">search, read, copy</text></g><g class="a4"><rect x="235" y="134" width="195" height="34" rx="6" class="tab"/><text x="249" y="156" class="label" text-anchor="start">UniProt</text><text x="416" y="156" class="small" text-anchor="end">search, read, copy</text></g><g class="a5"><rect x="30" y="176" width="195" height="34" rx="6" class="tab"/><text x="44" y="198" class="label" text-anchor="start">Franklin</text><text x="211" y="198" class="small" text-anchor="end">search, read, copy</text></g><g class="a6"><rect x="235" y="176" width="195" height="34" rx="6" class="tab"/><text x="249" y="198" class="label" text-anchor="start">VarSome</text><text x="416" y="198" class="small" text-anchor="end">search, read, copy</text></g><g class="a7"><rect x="30" y="218" width="195" height="34" rx="6" class="tab"/><text x="44" y="240" class="label" text-anchor="start">COSMIC</text><text x="211" y="240" class="small" text-anchor="end">search, read, copy</text></g><g class="a8"><rect x="235" y="218" width="195" height="34" rx="6" class="tab"/><text x="249" y="240" class="label" text-anchor="start">OncoKB</text><text x="416" y="240" class="small" text-anchor="end">search, read, copy</text></g><g class="a9"><text x="30" y="280" class="label" text-anchor="start">Then the same again for the next variant.</text><text x="30" y="304" class="note" text-anchor="start">Names differ from site to site, so results are hard to match.</text></g><g class="a10"><rect x="30" y="322" width="410" height="34" rx="6" class="warn"/><text x="44" y="344" class="warntext" text-anchor="start">Every search sends the variant to that website.</text></g><text x="30" y="392" class="small" text-anchor="start">Your time</text><rect x="30" y="400" width="410" height="12" rx="6" class="track"/><rect x="30" y="400" width="410" height="12" rx="6" class="badbar slow"/><rect x="500" y="10" width="450" height="420" rx="12" class="panel"/><text x="520" y="46" class="title" text-anchor="start">A whole VCF, with VarSight</text><text x="520" y="72" class="note" text-anchor="start">Works out the build from the file itself</text><rect x="520" y="88" width="410" height="36" rx="6" class="terminal"/><text x="534" y="111" class="code" text-anchor="start">$ varsight annotate sample.vcf.gz</text><g class="a12"><rect x="520" y="136" width="132" height="50" rx="6" class="file"/><text x="586" y="157" class="label" text-anchor="middle">report.html</text><text x="586" y="175" class="small" text-anchor="middle">search, filter, click</text></g><g class="a13"><rect x="659" y="136" width="132" height="50" rx="6" class="file"/><text x="725" y="157" class="label" text-anchor="middle">results.xlsx</text><text x="725" y="175" class="small" text-anchor="middle">for the team</text></g><g class="a14"><rect x="798" y="136" width="132" height="50" rx="6" class="file"/><text x="864" y="157" class="label" text-anchor="middle">results.tsv</text><text x="864" y="175" class="small" text-anchor="middle">for your scripts</text></g><g class="a15"><text x="520" y="214" class="note" text-anchor="start">Sorted so you know where to start, each with its reason</text></g><g class="a17"><text x="520" y="240" class="label" text-anchor="start">High</text><text x="930" y="240" class="label" text-anchor="end">402</text></g><rect x="590" y="228" width="82" height="16" rx="4" class="high a16"/><g class="a19"><text x="520" y="266" class="label" text-anchor="start">Medium</text><text x="930" y="266" class="label" text-anchor="end">275</text></g><rect x="590" y="254" width="56" height="16" rx="4" class="medium a18"/><g class="a21"><text x="520" y="292" class="label" text-anchor="start">Review</text><text x="930" y="292" class="label" text-anchor="end">1,100</text></g><rect x="590" y="280" width="224" height="16" rx="4" class="review a20"/><g class="a23"><text x="520" y="318" class="label" text-anchor="start">Low</text><text x="930" y="318" class="label" text-anchor="end">1,223</text></g><rect x="590" y="306" width="250" height="16" rx="4" class="low a22"/><g class="a24"><rect x="520" y="334" width="410" height="34" rx="6" class="good"/><text x="534" y="356" class="goodtext" text-anchor="start">Nothing left this computer. One link per database to check.</text></g><text x="520" y="392" class="small" text-anchor="start">Your time</text><rect x="520" y="400" width="410" height="12" rx="6" class="track"/><rect x="520" y="400" width="60" height="12" rx="6" class="goodbar quick a25"/></svg>
