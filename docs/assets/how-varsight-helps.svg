<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Left: checking one variant means searching eight websites one at a time, and each search sends the variant to that site. Right: one VarSight command turns a whole VCF into three reports, sorted by review priority, and nothing leaves the computer."><title>How VarSight helps</title><style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
