.note,.small{fill:#a3b2c2}
.tab,.file{fill:#11181f;stroke:#4a5a6a}
.terminal{fill:#0b1117}
.warn{fill:#4a1d17}
.warntext{fill:#ffb4a8}
.good{fill:#143d24}
.goodtext{fill:#a7e8bb}
.track{fill:#2b3845}
.badbar{fill:#ff8a7a}
.goodbar{fill:#4ade80}
.high{fill:#ff8a7a}
.medium{fill:#f2c063}
.review{fill:#8ab8f5}
.low{fill:#a3b2c2}
}
