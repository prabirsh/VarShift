[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varsight"
description = "Offline variant annotation for hg19 and hg38: p., c., g. or VCF in, checked annotation and reference links out."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabir Saha" }]
keywords = ["bioinformatics", "genomics", "variant annotation", "HGVS", "ClinVar", "VCF"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
varsight = "varsight.cli:main"

[tool.setuptools.dynamic]
version = { attr = "varsight.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
varsight = ["data/*.json"]
