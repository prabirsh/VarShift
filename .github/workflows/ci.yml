name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every source file
        run: python -W error -m compileall -q src tests tools
      - name: Unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
      - name: Install from a clean checkout and run the demo
        run: sh install.sh bin="$RUNNER_TEMP/bin" setup=no
      - name: The package also installs with pip
        run: |
          python -m pip install .
          varsight version
      - name: The installed package has no runtime dependencies
        run: python -c "import importlib.metadata as m; assert not m.requires('varsight')"

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -t . -v
      - name: Install from a clean checkout and run the demo, from PowerShell
        shell: powershell
        run: .\install.ps1 -BinDir "$env:RUNNER_TEMP\bin" -NoSetup -NoPath
      - name: The command works from Command Prompt
        shell: cmd
        run: |
          "%RUNNER_TEMP%\bin\varsight" version
          "%RUNNER_TEMP%\bin\varsight" demo demodir=demo out=cmd_demo replace
