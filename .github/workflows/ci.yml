name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every source file
        run: python -W error -m compileall -q src tests tools
      - name: Unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
      - name: Install from a clean checkout and run the demo
        run: ./install.sh --bin-dir "$RUNNER_TEMP/bin"
      - name: The package also installs with pip
        run: |
          python -m pip install --no-deps .
          varsight --version
      - name: The installed package has no runtime dependencies
        run: python -c "import importlib.metadata as m; assert not m.requires('varsight')"
