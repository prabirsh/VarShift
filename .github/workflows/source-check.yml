name: Source check

# Sources change their layout without notice. This asks each one whether the file is still there
# (header requests only) and opens a failing run if not, so a broken URL is found before a user hits it.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: PYTHONPATH=src python tools/check_sources.py
